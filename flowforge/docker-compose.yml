version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=flowforge-secret-key-change-in-production
      - DB_PATH=/app/flowforge.db
      - ENVIRONMENT=development
    volumes:
      - ./backend/migrations:/app/migrations
      - flowforge_data:/app
    networks:
      - flowforge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - flowforge-network

networks:
  flowforge-network:
    driver: bridge

volumes:
  flowforge_data:
