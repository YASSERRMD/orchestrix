version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=orchestrix-secret-key
      - DB_PATH=/app/orchestrix.db
    volumes:
      - orchestrix_data:/app
    networks:
      - orchestrix-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - orchestrix-network

networks:
  orchestrix-network:
    driver: bridge

volumes:
  orchestrix_data:
